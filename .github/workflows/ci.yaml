# .github/workflows/ci.yaml
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get --enforce-lockfile
      - name: Check the generated constants are current
        working-directory: packages/specstone_core
        run: |
          dart run tool/generate_shipped_packs.dart
          git diff --exit-code -- lib/src/templates/shipped_packs.g.dart
          dart run tool/generate_mermaid_script.dart
          git diff --exit-code -- lib/src/rendering/mermaid_script.g.dart
          dart run tool/generate_agent_text.dart
          git diff --exit-code -- lib/src/setup_migration/agent_text.g.dart
          test -z "$(git status --porcelain -- lib/src/templates/ lib/src/rendering/ lib/src/setup_migration/)"
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get --enforce-lockfile
      - name: Test specstone_core with coverage
        working-directory: packages/specstone_core
        run: dart run coverage:test_with_coverage --fail-under=80
      - name: Test specstone with coverage
        if: runner.os != 'Windows'
        working-directory: packages/specstone
        run: dart test --coverage-path=coverage/lcov.info --exclude-tags timing
      # The PowerShell script tests run in test-scripts-windows.
      - name: Test specstone with coverage (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/specstone
        run: dart test --coverage-path=coverage/lcov.info --exclude-tags timing,ps1
      - name: Timing gate (NFR-P01, NFR-P02)
        working-directory: packages/specstone
        run: dart test --tags timing test/nfr_timing_test.dart
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: packages/*/coverage/lcov.info

  test-scripts-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get --enforce-lockfile
      # Windows PowerShell 5.1 writes its module analysis cache on a background
      # thread about 13 s after a module is analyzed, so a child that lives
      # shorter never leaves one. This child outlives that delay, so the suite's
      # children (PSModuleAnalysisCachePath copies this file) start warm. The
      # step never fails the job: the printed line says whether the file exists.
      - name: Warm the Windows PowerShell module analysis cache
        shell: pwsh
        continue-on-error: true
        run: |
          $watch = [Diagnostics.Stopwatch]::StartNew()
          powershell.exe -NoProfile -Command "Get-Command -ListImported | Out-Null; Get-Command Expand-Archive, Invoke-WebRequest, Get-Item | Out-Null; Get-Module -ListAvailable | Out-Null; Start-Sleep -Seconds 15"
          $cache = Join-Path $env:LOCALAPPDATA 'Microsoft\Windows\PowerShell\ModuleAnalysisCache'
          if (Test-Path -LiteralPath $cache) {
            "ModuleAnalysisCache exists: $((Get-Item -LiteralPath $cache).Length) bytes"
          } else {
            "ModuleAnalysisCache is missing: $cache"
          }
          "warm-up took $($watch.ElapsedMilliseconds) ms"
          exit 0
      - name: Test the PowerShell scripts
        working-directory: packages/specstone
        env:
          SPECSTONE_PS_TIMING: '1'
        run: >-
          dart test --tags ps1 -r expanded --timeout 3m
          --file-reporter json:ps1-results.json
      # The JSON file names every test with its start and end time, so a
      # cancelled or timed-out run still shows which test it stood in.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ps1-results
          path: packages/specstone/ps1-results.json
