# .github/workflows/ci.yaml
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get --enforce-lockfile
      - name: Test specstone_core with coverage
        working-directory: packages/specstone_core
        run: dart test --coverage-path=coverage/lcov.info
      - name: Test specstone with coverage
        working-directory: packages/specstone
        run: dart test --coverage-path=coverage/lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: packages/*/coverage/lcov.info
