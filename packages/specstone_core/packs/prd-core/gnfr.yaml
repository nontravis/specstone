id: gnfr
description: |-
  The project-wide non-functional requirements; every item applies to every story.
  A category holds one `### NFR-<cat><NN> — <name>` block per target, or `N/A — <reason>` when none applies.
  Write each statement with one "shall" and a quantified value; avoid -ly and -ize words beyond the banned list.
  Write one rule per `NFR-*` ID, keep its bound in its Statement, and leave mechanics to the spec docs.
  Keep the trace in the entry's `**Traced from:**` bullet, never in the Statement.
  A project adds a missing category, such as Availability, as a project-layer section that keeps its IDs.
title: Project-wide non-functional requirements
path: prds/GNFR.md
bundle: [implement, design]
bundle_refs: true
sections:
  - id: performance
    header: Performance
    prefix_id: NFR-P
    required: true
    description: |-
      Cover timing, throughput, storage size, latency, accuracy, and precision, each with its margin.
      Give every value a unit and a tolerance, such as `< 200 ms` or `± 0.5 %`.
    template: |-
      ### NFR-P01 — <name>
      - **Statement:** The <product> shall <verb> <object> <value ± tolerance> <condition>.
      - **Rationale:** <reason and assumptions>
      - **Traced from:** <PG id, stakeholder expectation, standard, or self-derived>
      - **Verification:** <test | analysis | inspection | demonstration>; <pass criteria>; <level>
      - **Owner:** <name, or blank for the PROJECT owner>
      - **TBR:** <value, why, close action, who, by when; or none>
    lint:
      banned_words:
        - flexible
        - easy
        - sufficient
        - safe
        - ad hoc
        - adequate
        - accommodate
        - user-friendly
        - usable
        - when required
        - if required
        - appropriate
        - fast
        - portable
        - light-weight
        - small
        - large
        - maximize
        - minimize
        - robust
        - quickly
        - easily
        - clearly
        - this
        - these
        - as appropriate
        - etc.
        - and/or
        - but not limited to
      line_prefix: "- **Statement:**"
