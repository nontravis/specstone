id: gnfr
description: |-
  The project-wide non-functional requirements; every item applies to every story.
  Title it `# Project-wide non-functional requirements`, with no number.
  A category holds `### NFR-<cat><NN> — <name>` blocks, or `N/A — <reason>` when it has none.
  Write each statement with one "shall" and a quantified value; avoid the listed words and other -ly and -ize words.
  A project adds a missing category, such as Availability, as a project-layer section that keeps its IDs.
  State the present truth; history lives in git.
path: prds/GNFR.md
bundle: [implement, design]
sections:
  - id: performance
    header: Performance
    prefix_id: NFR-P
    required: true
    description: |-
      Cover timing, throughput, storage size, latency, accuracy, and precision, each with its margin.
      Give every value a unit and a tolerance, such as `< 200 ms` or `± 0.5 %`.
      Write one `### NFR-P01 — <name>` block per target, or `N/A — <reason>` when none applies.
    template: |-
      ### NFR-P01 — <name>
      - **Statement:** The <product> shall <verb> <object> <value ± tolerance> <condition>.
      - **Rationale:** <reason and assumptions>
      - **Traced from:** <PG id, stakeholder expectation, standard, or self-derived>
      - **Verification:** <test | analysis | inspection | demonstration>; <pass criteria>; <level>
      - **Owner:** <name, or blank for the PROJECT owner>
      - **TBR:** <value, why, close action, who, by when; or none>
    lint:
      banned_words:
        - flexible
        - easy
        - sufficient
        - safe
        - ad hoc
        - adequate
        - accommodate
        - user-friendly
        - usable
        - when required
        - if required
        - appropriate
        - fast
        - portable
        - light-weight
        - small
        - large
        - maximize
        - minimize
        - robust
        - quickly
        - easily
        - clearly
        - this
        - these
        - as appropriate
        - etc.
        - and/or
        - but not limited to
      line_prefix: "- **Statement:**"
