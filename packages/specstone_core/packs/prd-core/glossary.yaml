id: glossary
description: |-
  The project glossary doc: every domain term, one line each.
  Title it `# Domain glossary`, with no number. A project has exactly one glossary doc.
  Write one rule per item, since the `terms` section holds no IDs, and leave mechanics to the spec docs.
  Write one bullet per term, in the section template form.
  Keep each entry to 300 characters or fewer; its mechanics go to the spec doc that owns them, cited by a link.
  State the present truth; history lives in git.
  Cite a rule another doc owns by a link to the item that holds it, never restate it.
  Each sentence holds 25 words or fewer (Korean 17), or 100 characters in a script with no spaces (Japanese 60, Chinese 45).
  Put several conditions in a nested list. A one-sentence paragraph moves its detail to the section of the same doc that owns it, never into a sub-list.
  Put a cite or an ownership note at the item's end.
  Give a non-obvious rule one example inside its item, as a `such as` clause or one "For example," sentence.
  State the condition first, then the rule, one clause chain per sentence; split a sentence whose clauses nest.
path: prds/GLOSSARY.md
bundle: [query, implement, design]
bundle_refs: true
sections:
  - id: terms
    header: Terms
    skeleton: true
    description: |-
      Define each domain term in one line that ties it to a concrete entity.
    template: |-
      - **<Term>** — <one-line definition tying to a concrete entity>
    query: true
lint:
  banned_patterns:
    - id: doc_citation
      # [0-9][0-9]*, not [0-9]+: a loop after the first character stops the regex skip-ahead.
      pattern: 'DESIGN-[A-Z]|\b[Rr]uling|\bPlan [A-Z]\.[0-9]|\bM[0-9][0-9]*-T[0-9]+\b|\b[Mm]ilestone M?[0-9]+|\bschema v[0-9]|docs/superpowers|\b[A-Z][0-9][0-9]*[A-Z]?-[DR][0-9]+\b'
      message: cites a plan, milestone, ruling, or design doc
      in: all
    - id: history
      pattern: '\b(?:[Pp]reviously|[Nn]o longer(?! than)|[Ff]ormerly|[Ww]as renamed|[Ss]uperseded|[Rr]eversed|[Aa]s of (?:\d{4}-\d{2}-\d{2}|[A-Za-z]+ \d{4})|[Ss]ince (?:plan|milestone))\b'
      message: history prose; state the present truth only
      in: text
  max_lines: 400
  max_chars: 20000
  max_item_chars: 300
