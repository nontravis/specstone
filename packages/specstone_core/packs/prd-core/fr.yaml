id: fr
description: |-
  A functional requirement: one testable statement of what the product shall do, traced to a story scenario.
  Title it `# <Name>`, with no number.
  Write the Statement with one "shall" and its quantified value, such as `within 2 s`.
  Avoid -ly and -ize words beyond the banned list.
  State what the product does, never how; leave mechanics to the spec docs, and assign no task to a person. A skill's or agent's steps are code. An FR states only when it asks, what it reports, what it takes, its limits, and what it may write.
  Keep the trace in `traced_from` alone, never in the Statement or an edge case.
  Keep one behavior per FR; split joined behaviors into separate FRs.
  Write an edge case only for an outcome the Statement, an Input/Output row, and a table leave unstated, such as a refusal, a limit, a default, a fallback, or a "no finding" boundary another FR's finding takes.
  Write one edge case per distinct response; inputs with the same response are nested triggers of one case, one sample each.
  Leave out a case another FR or a spec rule owns, a case outside the Statement's condition, and implementation or test detail.
  Put a case with no designed response in the domain's `known_limits`, with what happens then, or with no domain doc in the feature's Out-of-scope as `<case> — not planned`. A designed response, even "the file is left as it is", is an edge case.
  In an error case, name the error code the person or caller sees and whether the run stops. State no exit status: the error catalog of the nearest feature up the FR's parent chain in the target holds it.
  Quote an error message only when it is part of the contract, once, in the Output row that defines it; with no catalog reaching the FR, state in words what the person sees.
  Trim edge cases the rules above leave out; split an FR still past the cap into new FRs in its story.
path: prds/features/f{nn}_{slug}/us{nn}_{slug}/fr{nn}_{slug}.md
parent: user_story
fields:
  - id: traced_from
    type: string
    list: true
    required: true
    description: |-
      Names the source: `S<N>`, Scenario N of the parent story; `<story Name>#S<N>`, Scenario N of a sibling story; or `self-derived`.
      Trace each FR to a scenario of a nominal or an off-nominal case.
      A self-derived FR needs the parent owner's agreement, or it is gold plating: delete it.
  - id: verify_method
    type: enum
    enum: [test, analysis, inspection, demonstration]
    required: true
    description: |-
      Names how the requirement is proven; set it with the statement.
      `test` runs the product and checks measured output; `analysis` proves it by reasoning or calculation.
      `inspection` examines the artifact, such as code or a document; `demonstration` shows it working without measuring.
  - id: owner
    type: string
    description: |-
      Names who writes the requirement and approves its changes; blank when the PROJECT owner holds it.
  - id: confirmed
    type: string
    list: true
    description: |-
      Records one `<link> <fingerprint>` entry per tracked link, such as `S2 047e817f9707`.
      Copy the fingerprint `specstone check` prints; the entry counts once the Owner approves the doc.
sections:
  - id: statement
    header: Statement
    required: true
    description: |-
      Use one "shall" and a positive form; rewrite "shall not" as the required behavior. Use no EARS keywords.
      Give every value a unit and a tolerance (<, ≥, ±); a statement without a number is an expectation for the story.
    template: |-
      The <product> shall <verb> <object> <value ± tolerance> <condition>.
    summary: true
    lint:
      max_sentences:
        - count: 1
      item_count:
        max: 1
      banned_patterns:
        - id: second_shall
          pattern: '\bshall\b.*\bshall\b'
          message: 'a second "shall"; guide line: Use one "shall" and a positive form'
          in: text
        - id: trace_outside_field
          # A scenario ID, a "traces Scenario" or "Traces from" phrase, "Scenario N of", or a scenario link.
          pattern: '(?<![\w-])S[0-9]+(?![\w-])|\b[Tt]races? (?:from \[?)?Scenarios?\b|\bScenarios? [0-9]+(?:[ ,]+(?:and |or )?[0-9]+)* of\b|\[Scenarios? [0-9]+[^\]]*\]|#scenario-[0-9]'
          message: 'trace outside traced_from; guide line: Keep the trace in `traced_from` alone'
          in: all
      banned_words:
        - flexible
        - easy
        - sufficient
        - safe
        - ad hoc
        - adequate
        - accommodate
        - user-friendly
        - usable
        - when required
        - if required
        - appropriate
        - fast
        - portable
        - light-weight
        - small
        - large
        - maximize
        - minimize
        - robust
        - quickly
        - easily
        - clearly
        - this
        - these
        - as appropriate
        - etc.
        - and/or
        - but not limited to
  - id: input_output
    header: Input / Output
    description: |-
      Write it when data crosses a boundary.
      Give each item a type, unit, format, and tolerance; write "don't care" for a value that does not matter.
      For a data interface, also cover the standard, message timing, protocol, error detection, initialization, and status.
    template: |-
      **Input**
      | Field   | Type   | Required | Notes         |
      | ------- | ------ | -------- | ------------- |
      | <field> | <type> | <yes/no> | <constraints> |

      **Output**
      | Field   | Type   | Notes              |
      | ------- | ------ | ------------------ |
      | <field> | <type> | <semantics, units> |
  - id: behavior
    header: Behavior
    description: |-
      Draw a Mermaid diagram when the behavior branches.
      State a required order of functions as a requirement, and an assumed order as an assumption. A skill's or agent's step order is neither.
      Quote a node label holding `(`, `)`, `[`, `]`, `{`, or `}`, as in `A["Save (draft)"]`; write `"` in it as `#quot;`.
    template: |-
      ```mermaid
      flowchart TD
        A[<step>] --> B{<decision>}
        B -- <branch> --> C[<outcome>]
      ```
    lint:
      diagram: {}
  - id: edge_cases
    header: Edge cases
    prefix_id: E
    required: true
    description: |-
      Write each as `E01 — <trigger> → <response>`.
      For several triggers, keep the `→` in the lead and join the response as indented lines, with no blank line.
      List the triggers as nested items.
    template: |-
      1. E01 — <trigger> → <response>
      2. E02 — <lead> → <response>
         <more response, one sentence per line, with no blank line>
         - <trigger>
         - <trigger>
    lint:
      names_codes: true
      item_count:
        max: 8
        waits_for: owner
      banned_patterns:
        - id: edge_case_arrow
          pattern: '^(?:\d+\.|[-*]) (?!.*→)'
          message: 'edge case has no →; guide line: E01 — <trigger> → <response>'
          in: all
        - id: exit_status
          pattern: '\b[Ee]xit status\b'
          message: 'edge case states an exit status; guide line: State no exit status'
          in: all
        - id: trace_outside_field
          # A scenario ID, a "traces Scenario" or "Traces from" phrase, "Scenario N of", or a scenario link.
          pattern: '(?<![\w-])S[0-9]+(?![\w-])|\b[Tt]races? (?:from \[?)?Scenarios?\b|\bScenarios? [0-9]+(?:[ ,]+(?:and |or )?[0-9]+)* of\b|\[Scenarios? [0-9]+[^\]]*\]|#scenario-[0-9]'
          message: 'trace outside traced_from; guide line: Keep the trace in `traced_from` alone'
          in: all
  - id: rationale
    header: Rationale
    required: true
    description: |-
      Confirm each assumption before the baseline.
      When the statement mandates a method, say why only that method will do.
    template: |-
      <reason, assumptions, related requirements, design constraints>
    lint:
      banned_patterns:
        - id: trace_outside_field
          # A scenario ID, a "traces Scenario" or "Traces from" phrase, "Scenario N of", or a scenario link.
          pattern: '(?<![\w-])S[0-9]+(?![\w-])|\b[Tt]races? (?:from \[?)?Scenarios?\b|\bScenarios? [0-9]+(?:[ ,]+(?:and |or )?[0-9]+)* of\b|\[Scenarios? [0-9]+[^\]]*\]|#scenario-[0-9]'
          message: 'trace outside traced_from; guide line: Keep the trace in `traced_from` alone'
          in: all
  - id: verification
    header: Verification
    required: true
    description: |-
      Give as pass criteria the observable condition that shows the requirement holds, apart from the statement.
      Give the proof level, such as unit, integration, or end to end.
      Write `- **Pass criteria:** each edge case holds.`, with one nested bullet per condition that no edge case, the Statement, or an Input / Output row states; state no exit status.
      Name no test file here; each target's record names the tests that prove the FR.
      Write no results in the FR; the verification matrix points to the evidence.
    template: |-
      - **Pass criteria:** each edge case holds.
      - **Level:** <level>

      - **Pass criteria:** each edge case holds.
        - <a condition no edge case, the Statement, or an Input / Output row states>
      - **Level:** <level>
    lint:
      banned_patterns:
        - id: test_file_named
          # The first branch skips a path whose file name the second branch reads, so one file gives one finding,
          # and skips a token made only of the verify-method words joined by a slash.
          pattern: '(?<![\w-])(?!(?<=(?:^|[^\w/.-])(?:(?:test|analysis|inspection|demonstration)/)*)tests?/(?:(?:test|analysis|inspection|demonstration)/)*(?:test|analysis|inspection|demonstration)(?![\w/-]|\.\w))tests?/(?![^\s`]*(?:_test|\.test|\.spec)\.\w)(?=[\w.-]|[`\s]|$)|\w(?:_test|\.test|\.spec)\.[A-Za-z0-9]+'
          message: 'Verification names a test file; guide line: Name no test file here'
          in: all
      required_patterns:
        - id: level_line
          pattern: '^- \*\*Level:\*\*'
          message: 'no Level line; guide line: Give the proof level'
        - id: pass_criteria_line
          pattern: '^- \*\*Pass criteria:\*\* each edge case holds\.\s*$'
          message: 'no Pass criteria line; guide line: Write `- **Pass criteria:** each edge case holds.`'
  - id: tbr
    header: TBR
    description: |-
      Write it when a value is still open; give a best estimate marked TBR.
    template: |-
      - **Value:** <best estimate>
      - **Why:** <reason>
      - **Close action:** <what resolves it>
      - **Who:** <name>
      - **By when:** <date or milestone>
    lint:
      banned_words:
        - TBD
lint:
  title_no_number: true
  banned_patterns:
    - id: doc_citation
      # [0-9][0-9]*, not [0-9]+: a loop after the first character stops the regex skip-ahead.
      pattern: 'DESIGN-[A-Z]|\b[Rr]uling|\bPlan [A-Z]\.[0-9]|\bM[0-9][0-9]*-T[0-9]+\b|\b[Mm]ilestone M?[0-9]+|\bschema v[0-9]|docs/superpowers|\b[A-Z][0-9][0-9]*[A-Z]?-[DR][0-9]+\b'
      message: cites a plan, milestone, ruling, or design doc
      in: all
    - id: history
      pattern: '\b(?:[Pp]reviously|[Nn]o longer(?! than)|[Ff]ormerly|[Ww]as renamed|[Ss]uperseded|[Rr]eversed|[Aa]s of (?:\d{4}-\d{2}-\d{2}|[A-Za-z]+ \d{4})|[Ss]ince (?:plan|milestone)|[Aa]s before (?:[A-Z][\w-]* )?v?\d+\.\d+)\b'
      message: history prose; state the present truth only
      in: text
  max_lines: 400
  max_chars: 20000
reference:
  - title: NASA Systems Engineering Handbook, NASA SP-2016-6105 Rev2
    url: https://www.nasa.gov/reference/systems-engineering-handbook/
    locator: Appendix C and section 4.2
