id: features
description: |-
  The feature map: the feature catalog, one diagram of the actors and systems, and the Systems table.
  Write one rule per ID; in a section with no IDs, one rule per item, with mechanics left to the spec docs.
  Keep a bound in the rule it limits, never in the diagram or a row.
  When `check` reports `chars_over_limit` or `lines_over_limit` on the feature map, propose moving related top features under one top feature as sub-features, as a move plan file for `specstone move --plan-file`; the Owner approves, and no text is cut to pass the cap.
  When every fitting parent holds stories, the plan first holds a `new feature --slug <slug>` line for a new top feature as the parent, then the moves.
  Propose no move that would pass the `feature` type's `max_depth`.
  When no fold fits, say why; the Owner may raise the cap in the project layer.
title: Feature map
path: prds/FEATURES.md
generators: [feature_catalog]
sections:
  - id: features
    header: Features
    required: true
    description: |-
      Holds the feature catalog, a generated block that `specstone format` fills; never written by hand.
  - id: diagram
    header: System interaction diagram
    required: true
    description: |-
      Draw one Mermaid diagram of the actors, the systems, and the external systems.
      Quote a node label holding any of `()[]{}`, as in `A["Save (draft)"]`; write `"` in it as `#quot;`.
    template: |-
      ```mermaid
      flowchart LR
        <Actor> --> <System>
        <System> --> <External>
      ```
    lint:
      diagram: {}
  - id: systems
    header: Systems
    required: true
    description: |-
      Add one row per user-facing system.
      A FEATURE's `system:` field names one of these rows.
    template: |-
      | System | Description |
      |--------|-------------|
      | <System name> | <One-line description of the system.> |
lint:
  title_no_number: true
  max_lines: 150
  max_chars: 10000
