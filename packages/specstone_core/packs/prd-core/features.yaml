id: features
description: |-
  The feature map: the feature catalog, one diagram of the actors and systems, and the Systems table.
  Title it `# Feature map`, with no number. It holds those three sections only.
  Write one rule per ID; in a section with no IDs, one rule per item, with mechanics left to the spec docs.
  Keep a bound in the rule it limits, never in the diagram or a row.
  State the present truth; history lives in git.
  Cite a rule another doc owns by a link to the item that holds it, never restate it.
  Each sentence holds 25 words or fewer (Korean 17), or 100 characters in a script with no spaces (Japanese 60, Chinese 45).
  Keep one rule in each item, and put several conditions in a nested list. A one-sentence paragraph with no ID moves its detail to the section of the same doc that owns it, never into a sub-list.
  Put a cite or an ownership note at the item's end.
  Give a non-obvious rule one example inside its item, as a `such as` clause or one "For example," sentence, within the sentence's cap.
  State the condition first, then the rule, one clause chain per sentence; split a sentence whose clauses nest.
path: prds/FEATURES.md
generators: [feature_catalog]
sections:
  - id: features
    header: Features
    required: true
    description: |-
      Holds the feature catalog, a generated block that `specstone format` fills; never written by hand.
  - id: diagram
    header: System interaction diagram
    required: true
    description: |-
      Draw one Mermaid diagram of the actors, the systems, and the external systems.
      Quote a node label that holds `(`, `)`, `[`, `]`, `{`, or `}`, as in `A["Save (draft)"]`; write `"` in it as `#quot;`.
    template: |-
      ```mermaid
      flowchart LR
        <Actor> --> <System>
        <System> --> <External>
      ```
    lint:
      diagram: {}
  - id: systems
    header: Systems
    required: true
    description: |-
      Add one row per user-facing system: its name and a one-line description.
      A FEATURE's `system:` field names one of these rows.
    template: |-
      | System | Description |
      |--------|-------------|
      | <System name> | <One-line description of the system.> |
lint:
  banned_patterns:
    - id: doc_citation
      # [0-9][0-9]*, not [0-9]+: a loop after the first character stops the regex skip-ahead.
      pattern: 'DESIGN-[A-Z]|\b[Rr]uling|\bPlan [A-Z]\.[0-9]|\bM[0-9][0-9]*-T[0-9]+\b|\b[Mm]ilestone M?[0-9]+|\bschema v[0-9]|docs/superpowers|\b[A-Z][0-9][0-9]*[A-Z]?-[DR][0-9]+\b'
      message: cites a plan, milestone, ruling, or design doc
      in: all
    - id: history
      pattern: '\b(?:[Pp]reviously|[Nn]o longer(?! than)|[Ff]ormerly|[Ww]as renamed|[Ss]uperseded|[Rr]eversed|[Aa]s of (?:\d{4}-\d{2}-\d{2}|[A-Za-z]+ \d{4})|[Ss]ince (?:plan|milestone))\b'
      message: history prose; state the present truth only
      in: text
  max_lines: 400
  max_chars: 20000
