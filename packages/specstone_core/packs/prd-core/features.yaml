id: features
description: |-
  The system map: one diagram of the actors and systems, and the table of user-facing systems.
  Title it `# System map`, with no number. It holds the diagram and the Systems table only.
  State the present truth; history lives in git.
path: prds/FEATURES.md
sections:
  - id: diagram
    header: System interaction diagram
    required: true
    description: |-
      Draw one Mermaid diagram of the actors, the systems, and the external systems.
    template: |-
      ```mermaid
      flowchart LR
        <Actor> --> <System>
        <System> --> <External>
      ```
  - id: systems
    header: Systems
    required: true
    description: |-
      Add one row per user-facing system: its name and a one-line description.
      A FEATURE's `system:` field names one of these rows.
    template: |-
      | System | Description |
      |--------|-------------|
      | <System name> | <One-line description of the system.> |
lint:
  banned_patterns:
    - id: doc_citation
      # [0-9][0-9]*, not [0-9]+: a loop after the first character stops the regex skip-ahead.
      pattern: 'DESIGN-[A-Z]|\b[Rr]uling|\bPlan [A-Z]\.[0-9]|\bM[0-9][0-9]*-T[0-9]+\b|\b[Mm]ilestone M?[0-9]+|\bschema v[0-9]|docs/superpowers|\b[A-Z][0-9][0-9]*[A-Z]?-[DR][0-9]+\b'
      message: cites a plan, milestone, ruling, or design doc
      in: all
    - id: history
      pattern: '\b(?:[Pp]reviously|[Nn]o longer(?! than)|[Ff]ormerly|[Ww]as renamed|[Ss]uperseded|[Rr]eversed|[Aa]s of (?:\d{4}-\d{2}-\d{2}|[A-Za-z]+ \d{4})|[Ss]ince (?:plan|milestone))\b'
      message: history prose; state the present truth only
      in: text
  max_lines: 400
