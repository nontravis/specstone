id: reference
description: |-
  A reference card: the summary of one outside source that the project keeps in its own folder.
  Title it `# <Name>`, the name of the source, with no number.
  The folder holds the original files; the card sits beside them.
  Put every fact the project relies on in the card, since an agent reads it instead of the original.
  Write one rule per ID; in a section with no IDs, one rule per item, with mechanics left to the spec docs.
  Keep a bound in the item it limits, and the trace to the source in `source:` and `files:`, never in the summary.
  Add a new card for a new edition, and mark the older one superseded; do not edit a card to hide its history.
path: prds/references/{slug}/REFERENCE.md
fields:
  - id: source
    type: string
    required: true
    description: |-
      Names where the source came from: a URL, a publisher and edition, or who handed it over.
  - id: files
    type: string
    list: true
    required: true
    description: |-
      Lists the file names in this folder.
  - id: status
    enum: [current, superseded]
    description: |-
      current: the edition the project relies on today.
      superseded: a newer edition replaced it; kept because older decisions cite it.
sections:
  - id: summary
    header: Summary
    required: true
    description: |-
      Give each fact's page or section.
    template: |-
      - <A fact the project relies on> (<page or section>)
    lint:
      banned_patterns:
        - id: fact_locator
          # A bullet line that does not end in a non-empty `(...)` tail; a wrapped, blank, table, or header line is no bullet.
          pattern: '^[-*+] (?!.*\([^()]+\)\.?\s*$)'
          message: "fact has no `(<page or section>)` tail; guide line: Give each fact's page or section"
          in: all
  - id: key_terms
    header: Key terms
    description: |-
      Define the terms of the source that the project reuses, in the source's own words.
    template: |-
      - **<Term>:** <the source's definition> (<page or section>)
lint:
  title_no_number: true
  max_lines: 400
  max_chars: 20000
