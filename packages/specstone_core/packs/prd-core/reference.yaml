id: reference
description: |-
  A reference card: the summary of one outside source that the project keeps in its own folder.
  Title it `# <Name>`, the name of the source, with no number.
  The folder holds the original files; the card sits beside them.
  `source:` says where the source came from, and `files:` lists the file names in the folder.
  Write the card so that an agent reads it instead of the original: every fact the project relies on is on the card.
  Write one rule per ID; in a section with no IDs, one rule per item, with mechanics left to the spec docs.
  Keep a bound in the item it limits, and the trace to the source in `source:` and `files:`, never in the summary.
  Add a new card for a new edition, and mark the older one superseded; do not edit a card to hide its history.
  Cite a rule another doc owns by a link to the item that holds it, never restate it.
  Each sentence holds 25 words or fewer (Korean 17), or 100 characters in a script with no spaces (Japanese 60, Chinese 45).
  Keep one rule in each item, and put several conditions in a nested list. A one-sentence paragraph with no ID moves its detail to the section of the same doc that owns it, never into a sub-list.
  Put a cite or an ownership note at the item's end.
  Give a non-obvious rule one example inside its item, as a `such as` clause or one "For example," sentence, within the sentence's cap.
  State the condition first, then the rule, one clause chain per sentence; split a sentence whose clauses nest.
path: prds/references/{slug}/REFERENCE.md
fields:
  - id: source
    type: string
    required: true
    description: |-
      Names where the source came from: a URL, a publisher and edition, or who handed it over.
  - id: files
    type: string
    list: true
    required: true
    description: |-
      Lists the file names in this folder.
  - id: status
    enum: [current, superseded]
    description: |-
      current: the edition the project relies on today.
      superseded: a newer edition replaced it; kept because older decisions cite it.
sections:
  - id: summary
    header: Summary
    required: true
    description: |-
      State every fact the project relies on, and give the page or section of each one.
      Agents read this card, not the original, so a fact missing here is lost to them.
    template: |-
      - <A fact the project relies on> (<page or section>)
  - id: key_terms
    header: Key terms
    description: |-
      Optional. Define the terms of the source that the project reuses, in the source's own words.
    template: |-
      - **<Term>:** <the source's definition> (<page or section>)
lint:
  max_lines: 400
