id: goal
description: |-
  The project goal doc: every goal, grouped by the horizon it serves.
  Title it `# Project goals`, with no number. A project has exactly one GOAL.
  Write one rule per `PG-*` ID, and leave mechanics to the spec docs.
  A new goal takes the next number above the doc's highest `PG-` ID, and no ID is used again.
  A goal that changes horizon moves its block to that horizon's section, its ID kept.
  A goal met or dropped is deleted from the goal doc together with its measurement; the doc has no status field and no archive section.
  A long-term goal with no deadline leaves out `**By:**`; every other `**By:**` names a date or a milestone.
  The Metric holds the goal's pass bound and unit and links the goal's measurement; GOAL holds no measured number.
  State the present truth; history lives in git.
  Cite a rule another doc owns by a link to the item that holds it, never restate it.
  Each sentence holds 25 words or fewer (Korean 17), or 100 characters in a script with no spaces (Japanese 60, Chinese 45).
  Keep one rule in each item, and put several conditions in a nested list. A one-sentence paragraph with no ID moves its detail to the section of the same doc that owns it, never into a sub-list.
  Put a cite or an ownership note at the item's end.
  Give a non-obvious rule one example inside its item, as a `such as` clause or one "For example," sentence, within the sentence's cap.
  State the condition first, then the rule, one clause chain per sentence; split a sentence whose clauses nest.
path: prds/GOAL.md
bundle: [implement, design]
bundle_refs: true
sections:
  - id: long_term
    header: Long-term goals
    prefix_id: PG-
    skeleton: true
    description: |-
      Optional. Put here a goal for a year or more, or for the project's whole life.
      Its `**Serves:**` names a vision.
      The Metric is a numeric metric with unit; it names no other project, no scope item, and no baseline number.
    template: |-
      ### PG-01 — <short name>
      - **Serves:** PV-01
      - **Statement:** <goal statement>
      - **Metric:** <numeric target with unit>
      - **By:** <date or milestone>
    lint:
      banned_patterns:
        - id: metric_number
          pattern: '^(?:- )?\*\*Metric:\*\*(?!.*\d)'
          message: 'Metric line holds no number; guide line: a numeric metric with unit'
          in: all
  - id: mid_term
    header: Mid-term goals
    prefix_id: PG-
    skeleton: true
    description: |-
      Optional. Put here a goal for a quarter or more.
      Its `**Serves:**` names a vision or a long-term goal.
      The Metric is a numeric metric with unit; it names no other project, no scope item, and no baseline number.
    template: |-
      ### PG-01 — <short name>
      - **Serves:** PV-01
      - **Statement:** <goal statement>
      - **Metric:** <numeric target with unit>
      - **By:** <date or milestone>
    lint:
      banned_patterns:
        - id: metric_number
          pattern: '^(?:- )?\*\*Metric:\*\*(?!.*\d)'
          message: 'Metric line holds no number; guide line: a numeric metric with unit'
          in: all
  - id: short_term
    header: Short-term goals
    prefix_id: PG-
    skeleton: true
    description: |-
      Optional. Put here a goal for under a quarter.
      Its `**Serves:**` names a vision, a long-term goal, or a mid-term goal.
      The Metric is a numeric metric with unit; it names no other project, no scope item, and no baseline number.
    template: |-
      ### PG-01 — <short name>
      - **Serves:** PV-01
      - **Statement:** <goal statement>
      - **Metric:** <numeric target with unit>
      - **By:** <date or milestone>
    lint:
      banned_patterns:
        - id: metric_number
          pattern: '^(?:- )?\*\*Metric:\*\*(?!.*\d)'
          message: 'Metric line holds no number; guide line: a numeric metric with unit'
          in: all
lint:
  banned_patterns:
    - id: doc_citation
      # [0-9][0-9]*, not [0-9]+: a loop after the first character stops the regex skip-ahead.
      pattern: 'DESIGN-[A-Z]|\b[Rr]uling|\bPlan [A-Z]\.[0-9]|\bM[0-9][0-9]*-T[0-9]+\b|\b[Mm]ilestone M?[0-9]+|\bschema v[0-9]|docs/superpowers|\b[A-Z][0-9][0-9]*[A-Z]?-[DR][0-9]+\b'
      message: cites a plan, milestone, ruling, or design doc
      in: all
    - id: history
      pattern: '\b(?:[Pp]reviously|[Nn]o longer(?! than)|[Ff]ormerly|[Ww]as renamed|[Ss]uperseded|[Rr]eversed|[Aa]s of (?:\d{4}-\d{2}-\d{2}|[A-Za-z]+ \d{4})|[Ss]ince (?:plan|milestone))\b'
      message: history prose; state the present truth only
      in: text
  max_lines: 400
  max_chars: 20000
