id: channel
description: |-
  A channel: one place the project's marketing reaches its audience, with its audience, format, cadence, and measures.
  Title it `# <Channel name>`, with no number.
  The docs hold the stable facts and the campaign plan; the project's own skills write the content outside the docs.
  A learning edits the doc it corrects.
path: specs/marketing/channels/{slug}.md
sections:
  - id: audience
    header: Audience
    description: |-
      Name the audience segments the channel reaches.
  - id: format
    header: Format
    description: |-
      Name the content formats the channel carries.
  - id: cadence
    header: Cadence
    description: |-
      Write how often the project posts on the channel.
  - id: measures
    header: Measures
    description: |-
      List the measures that show the channel works.
reference:
  - title: marketingskills, product-marketing
    url: https://raw.githubusercontent.com/coreyhaines31/marketingskills/main/skills/product-marketing/SKILL.md
