name: software-design-system
version: 1.7.0
extends: software-tech
migrations:
  - from: 1.5.0
    steps:
      - mark_retrim:
          doc_types: [accessibility, color, component, component_group, content, contributing, discovery, elevation, guidelines, icon, layout, motion, setup, shape, spacing, theme, tokens, typography, ui_pattern]
          sections: [accessibility_bar, color_roles, purpose, when_to_use, anatomy, variants, states, props, examples, keyboard, accessibility, writing_rules, definition_of_done, finding_a_component, component_catalog, elevation_levels, reading_order, hard_rules, icon_set, sizes, naming, layouts, grids, durations, easings, install_contract, shapes, spacing_scale, themes, token_mapping, token_list, type_scale, components_used, composition]
shared_lines:
  - id: serve_library_builders
    text: These docs serve the team that builds the library, not the library's consumers.
    for_doc_types: [accessibility, color, component, component_group, content, contributing, discovery, elevation, guidelines, icon, layout, motion, setup, shape, spacing, theme, tokens, typography, ui_pattern]
  - id: library_spec_scope
    text: 'Write only what a plan needs and code cannot show: a decision and its why, a contract callers rely on, a constraint code honors.'
    for_doc_types: [accessibility, color, component, component_group, content, contributing, discovery, elevation, guidelines, icon, layout, motion, setup, shape, spacing, theme, tokens, typography, ui_pattern]
  - id: library_code_detail_home
    text: Leave signatures, field lists, names, file layout, and steps to the code, or to the plan before the code exists.
    for_doc_types: [accessibility, color, component, component_group, content, contributing, discovery, elevation, guidelines, icon, layout, motion, setup, shape, spacing, theme, tokens, typography, ui_pattern]
shared_banned_patterns:
  - id: token_value
    # A hex color, or a number with a unit; a token name or a link to a token row holds neither.
    pattern: '(?<![\w/.-])#(?:[0-9a-fA-F]{8}|[0-9a-fA-F]{6}|[0-9a-fA-F]{4}|[0-9a-fA-F]{3})(?![\w-])|(?<![\w.#])(?:\d+(?:\.\d+)?|\.\d+)(?:px|r?em|pt|dp|sp|ms|s|%)(?![\w%])'
    message: 'token value in a foundation doc; guide line: it links the tokens doc and writes no token value'
    in: all
    for_doc_types: [color, elevation, motion, shape, spacing, typography]
    sections: [color_roles, type_scale, spacing_scale, elevation_levels, shapes, durations, easings]
  - id: link_item
    # A list item that does not open with a link; a wrapped, blank, table, or header line is no item.
    pattern: '^(?:[-*+]|\d+[.)]) (?!\[)'
    message: source of the link_item regex that the reading_order and components_used entries take by pattern_ref
