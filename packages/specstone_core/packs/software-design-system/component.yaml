id: component
description: |-
  A component: one component's contract, inside its component group.
  Title it `# <Component name>`, with no number.
  The component doc holds no code, so it serves the library in any language.
  The Agent writes Props by hand. A design file from another tool, such as a Figma frame, is input for deciding them, and Specstone never generates props from it.
  Examples state each scenario as prop values, never as code.
path: specs/design_system/components/{slug}/{slug}.md
parent: component_group
fields:
  - id: lifecycle
    type: enum
    enum: [beta, stable, deprecated]
    required: true
    description: |-
      The built-in `status` never holds the component's lifecycle.
  - id: feature
    type: doc_ref
    doc_types: [feature]
    required: true
    description: |-
      Names the feature whose stories ask for the component.
  - id: design_source
    type: source_ref
    list: true
    description: |-
      Lists each design file or link the props were decided from.
sections:
  - id: purpose
    header: Purpose
    required: true
    summary: true
    description: |-
      Write what the component is for; its first sentence is the catalog's purpose.
  - id: when_to_use
    header: When to use
    required: true
    description: |-
      Write when to use the component, when not, and the component to use instead.
      Fold the Do and Don't points into this section.
  - id: anatomy
    header: Anatomy
    description: |-
      List the named parts; write this section when the component has two or more.
  - id: variants
    header: Variants
    description: |-
      List each variant with the prop value that picks it; write this section when the component has more than one look.
  - id: states
    header: States
    description: |-
      List each state beyond default and what shows in it.
  - id: props
    header: Props
    required: true
    description: |-
      Write one row per prop, its type one of `text`, `number`, `boolean`, `choice`, and `on-tap` in the second column.
    lint:
      banned_patterns:
        - id: prop_type_value
          # A table row whose second cell is none of the five types, the `Type` header, or a separator.
          pattern: '^\|[^|]*\|(?!\s*(?:`?(?:text|number|boolean|choice|on-tap)`?|[Tt]ype|:?-+:?)\s*\|)'
          message: 'prop type is not text, number, boolean, choice, or on-tap; guide line: Write one row per prop, its type one of `text`, `number`, `boolean`, `choice`, and `on-tap` in the second column.'
          in: all
  - id: examples
    header: Examples
    required: true
    description: |-
      Write one table of a scenario to its prop values.
  - id: keyboard
    header: Keyboard
    description: |-
      Write the keys the component answers to; write this section for an interactive component alone.
  - id: accessibility
    header: Accessibility
    required: true
    description: |-
      Write only what the component adds to the library-wide accessibility bar, or link to the bar.
lint:
  title_no_number: true
