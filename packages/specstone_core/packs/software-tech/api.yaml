id: api
description: |-
  The API of one feature: which operations it uses, how each is called, and where the source of truth declares it.
  Title it `# <Feature name> API`, such as `# Rendering API`, with no number.
  Aim for about 150 to 200 lines; keep one file per feature spec folder.
  Never write `status:`; whether code exists in a target lives in that target's record, its `implementation` docs, only.
  Copy no request or response schema; the source of truth owns it.
  Write one rule per ID: one `###` per operation, each rule one sentence.
  Cite a rule another doc owns by a link to the item that holds it, never restate it.
  This includes a rule of a project spec doc or of an ancestor feature's spec doc.
  This doc holds one feature's spec; a rule every feature uses goes to the project's API doc.
  Write an `Overrides:` line right after an item that departs from a rule above, as `Overrides: [<ID>](<doc>#<section>) — <how it differs>, because <why>`, and record its `overrides` entry.
  Each sentence holds 25 words or fewer (Korean 17), or 100 characters in a script with no spaces (Japanese 60, Chinese 45).
  Keep one rule in each item, and put several conditions in a nested list. A one-sentence paragraph with no ID moves its detail to the section of the same doc that owns it, never into a sub-list.
  Put a cite or an ownership note at the item's end.
  Give a non-obvious rule one example inside its item, as a `such as` clause or one "For example," sentence, within the sentence's cap.
  State the condition first, then the rule, one clause chain per sentence; split a sentence whose clauses nest.
path: specs/f{nn}_{slug}/API.md
parent: feature
per_target: true
fields:
  - id: confirmed
    type: string
    list: true
    description: |-
      Records one `<FR ref> <fingerprint>` entry per FR trace row, the FR ref as the FR cell writes it.
      Example: `email_login/validate_credentials 5d1e0c4b7a92`; the entry counts once the Owner approves the doc.
  - id: overrides
    type: string
    list: true
    description: |-
      Records one `<doc type>:<name>#<ID> <fingerprint>` entry per item the doc's `Overrides:` lines link.
      Example: `project_domain:domain#INV-3 3f9a1c0b7e2d`; the entry counts once the Owner approves the doc.
  - id: tasks
    type: task_ref
    list: true
    description: |-
      Lists the tasks that track the doc's work, each `<item>:<task>`, or `<task>` alone for the whole doc, such as `INV-4:ENG-42`.
      `specstone-sync-sdd` removes an entry once a synced commit closes its task with a closing word, such as `Closes ENG-42`; put that word in the commit that finishes the task's work.
sections:
  - id: source_of_truth
    header: Source-of-truth
    description: |-
      Omit this section when the project has no OpenAPI or ApiDog file, as a CLI project has none.
      Otherwise write a table with the columns Format, Path, Purpose.
      Write each Path relative to this file, resolving to a real file.
  - id: fr_trace
    header: FR trace
    required: true
    description: |-
      Write a table with the columns FR and Operation, one row per FR: an operation that proves two FRs takes two rows.
      Write the `operationId` or the command in Operation; it is the pointer, a name and never a copy.
      Give every row a block in Operations, and every block a row.
      Name each FR by its path below this API's feature: `<story slug>/<fr slug>`, such as `email_login/validate_credentials`,
      or `<sub-feature slug>/<story slug>/<fr slug>` for a story in a sub-feature, as its `confirmed` entry does.
  - id: operations
    header: Operations
    required: true
    description: |-
      Write one `###` per operation, headed `` `<operation>` `` alone with no FR label, holding a Request example.
      Write a success and an error Response example, both required and valid against the source of truth when one exists.
      Write Errors as the codes with a pointer to the error doc, and Auth as a scope or `none`.
      Write Idempotent on every mutating operation: `yes` with the key, or `no`.
      Write no Why line; the reason a legacy Why line gives goes to the `Rationale` of the FR the operation traces.
    lint:
      banned_patterns:
        - id: operation_heading
          pattern: '^### `[^`]+`\s*\S'
          message: 'operation heading has text after its code span; guide line: alone with no FR label'
          in: all
      required_patterns:
        - id: response_success
          pattern: '^\*\*Response example — success\*\*'
          message: 'operation has no success Response example; guide line: Write a success and an error Response example, both required and valid against the source of truth when one exists'
          per_subsection: true
        - id: response_error
          pattern: '^\*\*Response example — error\*\*'
          message: 'operation has no error Response example; guide line: Write a success and an error Response example, both required and valid against the source of truth when one exists'
          per_subsection: true
  - id: compatibility
    header: Compatibility
    description: |-
      Write what counts as breaking for the feature's operations.
      End with a pointer to the Rollout section of the architecture doc.
lint:
  max_chars: 50000
  max_lines: 300
reference:
  - title: OpenAPI Specification 3.2.1
    url: https://spec.openapis.org/oas/v3.2.1.html
    locator: Operation Object (operationId); Working with Examples
  - title: Google AIP-121, Resource-oriented design
    url: https://google.aip.dev/121
    locator: Guidance
  - title: Google AIP-180, Backwards compatibility
    url: https://google.aip.dev/180
    locator: Guidance (source, wire, semantic compatibility)
  - title: Microsoft Azure REST API Guidelines
    url: https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md
    locator: Exactly Once Behavior; Handling Errors
