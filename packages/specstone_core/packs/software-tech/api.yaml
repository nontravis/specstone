id: api
description: |-
  One feature's API: its operations, how each is called, and where the source of truth declares it.
  Title it `# <Feature name> API`, such as `# Rendering API`, with no number.
  Copy no request or response schema; the source of truth owns it.
  Write one rule per ID: one `###` per operation, filled as Operations gives; state every other rule in one sentence.
  Put a rule every feature uses in the project's API doc.
path: specs/f{nn}_{slug}/API.md
parent: feature
per_target: true
fields:
  - id: confirmed
    type: string
    list: true
    description: |-
      Records one `<FR ref> <fingerprint>` per FR trace row, the ref as its FR cell writes it, such as `email_login/validate_credentials 5d1e0c4b7a92`; it counts once the Owner approves the doc.
sections:
  - id: source_of_truth
    header: Source-of-truth
    description: |-
      Write a table of Format, Path, Purpose for the project's OpenAPI or ApiDog file; a CLI project has none.
      Write each Path relative to this file, naming a real file.
  - id: fr_trace
    header: FR trace
    required: true
    description: |-
      Write a table of FR and Operation, one row per FR, so an operation proving two FRs takes two rows.
      Put the `operationId` or command in Operation, a pointer, never a copy.
      Name each FR by its path below this API's feature, `<story slug>/<fr slug>` such as `email_login/validate_credentials`,
      or `<sub-feature slug>/<story slug>/<fr slug>` in a sub-feature.
  - id: operations
    header: Operations
    required: true
    description: |-
      Write one `###` per operation, headed `` `<operation>` `` alone with no FR label, holding a Request example.
      Write a success and an error Response example, valid against the source of truth, only in a doc that holds that section.
      Write one Errors line, `**Errors:** <codes>; see <links>`. List every code the operation returns as a code span, then one link per error doc that owns them. Hold no per-code text, and hand off to no other operation's list. Write `**Errors:** none` when the operation returns no code. When the codes would pass the sentence word cap, name each group of codes the error doc defines in place of its codes, ``**Errors:** the `<group>` codes, `<code>`, …; see <links>``, only when the operation returns all its codes.
      Write Auth as `**Auth:** <scope or none>`, and Idempotent on every mutating operation: `yes` with the key, or `no`.
      Write no Why line; a legacy Why's reason goes to the traced FR's `Rationale`.
    lint:
      banned_patterns:
        - id: operation_heading
          pattern: '^### `[^`]+`\s*\S'
          message: 'operation heading has text after its code span; guide line: alone with no FR label'
          in: all
        - id: why_line
          pattern: '^(?:- )?\*\*Why:\*\*'
          message: 'operation holds a Why line; guide line: Write no Why line'
          in: all
      required_patterns:
        - id: errors_line
          pattern: '^(?:- )?\*\*Errors:\*\*'
          message: 'no Errors line in the colon form; guide line: Write one Errors line'
          per_subsection: true
        - id: auth_line
          pattern: '^(?:- )?\*\*Auth:\*\*'
          message: 'no Auth line in the colon form; guide line: **Auth:** <scope or none>'
          per_subsection: true
  - id: compatibility
    header: Compatibility
    description: |-
      Write what counts as breaking for the feature's operations; point at the architecture doc's Rollout.
lint:
  title_no_number: true
  max_chars: 50000
  max_lines: 300
reference:
  - title: OpenAPI Specification 3.2.1
    url: https://spec.openapis.org/oas/v3.2.1.html
    locator: Operation Object (operationId); Working with Examples
  - title: Google AIP-121, Resource-oriented design
    url: https://google.aip.dev/121
    locator: Guidance
  - title: Google AIP-180, Backwards compatibility
    url: https://google.aip.dev/180
    locator: Guidance (source, wire, semantic compatibility)
  - title: Microsoft Azure REST API Guidelines
    url: https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md
    locator: Exactly Once Behavior; Handling Errors
