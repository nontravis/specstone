id: error
description: |-
  The error taxonomy of one feature: its codes, how a client acts on each, and when a call retries.
  Title it `# <Feature name> errors`, such as `# Rendering errors`, with no number.
  Keep one file per feature spec folder.
  Never write `status:`; whether code exists in a target lives in that target's record, its `implementation` docs, only.
  Put no stack trace or internals in any error body.
  Write one rule per ID: one catalog row per code.
  Cite a rule another doc owns by a link to the item that holds it, never restate it.
  This includes a rule of a project spec doc or of an ancestor feature's spec doc.
  This doc holds one feature's spec; a rule every feature uses goes to the project's ERROR doc.
  Write an `Overrides:` line right after an item that departs from a rule above, or right under the table when that item is a table row, its how-clause naming the row, as `Overrides: [<ID>](<doc>#<section>) — <how it differs>, because <why>`, and record its `overrides` entry.
  Keep one rule in each item, and put several conditions in a nested list. A one-sentence paragraph with no ID moves its detail to the section of the same doc that owns it, never into a sub-list.
  Put a cite or an ownership note at the item's end.
  Give a non-obvious rule one example inside its item, as a `such as` clause or one "For example," sentence, within the sentence's cap.
  State the condition first, then the rule, one clause chain per sentence; split a sentence whose clauses nest.
path: specs/f{nn}_{slug}/ERROR.md
parent: feature
per_target: true
fields:
  - id: overrides
    type: string
    list: true
    description: |-
      Records one `<doc type>:<name>#<ID> <fingerprint>` entry per item the doc's `Overrides:` lines link.
      Example: `project_domain:domain#INV-3 3f9a1c0b7e2d`; the entry counts once the Owner approves the doc.
  - id: tasks
    type: task_ref
    list: true
    description: |-
      Lists the tasks that track the doc's work, each `<item>:<task>`, or `<task>` alone for the whole doc, such as `INV-4:ENG-42`.
      `specstone-sync-sdd` removes an entry once a synced commit closes its task with a closing word, such as `Closes ENG-42`; put that word in the commit that finishes the task's work.
sections:
  - id: error_envelope
    header: Error envelope
    description: |-
      Write this section only when the envelope differs from the project's one envelope.
      Show the shape of the envelope, and justify the difference.
  - id: error_catalog
    header: Error catalog
    required: true
    description: |-
      Write a table with the columns Code, Exit/HTTP, Category, Triggered by, Implemented by, Client guidance.
      Add an optional Details column holding machine fields per code, such as `file`, `key`, `retry_after`.
      Write one row per code; keep codes stable and never reused for a different error.
      Write Triggered by as the general condition that raises the code in that feature, such as a flag out of range.
      List no raising site there. Write Client guidance as one line: the action the client takes, not user copy.
    lint:
      catalog:
        column: Code
      max_sentences:
        - count: 1
          column: Triggered by
        - count: 1
          column: Client guidance
  - id: retry_policy
    header: Retry policy
    required: true
    description: |-
      Write a table with the columns Category, Retry?, Backoff, Max attempts.
      Write the default rows by category first, then the per-code override rows.
      Never retry a non-idempotent call: write Retry? as no for it, whatever its category.
  - id: fallback
    header: Fallback
    description: |-
      Omit this section when the feature has no graceful-degradation path.
      Write the code and its trigger, such as persisting past max retries.
      Write the degraded behavior as bullets, such as a read-only mode, a disabled control, or an emitted metric.
lint:
  max_chars: 50000
  max_lines: 300
reference:
  - title: RFC 9457, Problem Details for HTTP APIs
    url: https://www.rfc-editor.org/rfc/rfc9457
    locator: 3.1 Members; 4 Defining New Problem Types; 5 Security Considerations
  - title: Google AIP-193, Errors
    url: https://google.aip.dev/193
    locator: ErrorInfo (reason, domain, metadata); Changing error messages
  - title: Google AIP-194, Automatic retry configuration
    url: https://google.aip.dev/194
    locator: Guidance
  - title: Microsoft Azure REST API Guidelines
    url: https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md
    locator: Handling Errors
