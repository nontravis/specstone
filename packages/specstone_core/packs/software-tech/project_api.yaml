id: project_api
extends: api
description: |-
  The project's API conventions: the rules every feature's operations follow, and where the source of truth declares them.
  Title it `# <Project name> API`, such as `# Specstone API`, with no number.
  Copy no request or response schema; the source of truth owns it.
  Write one rule per ID: one bullet per convention.
path: specs/API.md
parent:
bundle: [implement, design]
fields:
  - id: confirmed
    disabled: true
  - id: overrides
    disabled: true
sections:
  - id: fr_trace
    disabled: true
  - id: operations
    disabled: true
  - id: conventions
    header: Conventions
    after: source_of_truth
    required: true
    prefix_id: API-C
    description: |-
      Write one bullet per API convention every feature's operations follow, such as an ID format or a pagination rule.
      Write each as `- **API-C<N>** <rule>`; IDs are append-only, never reused.
    lint:
      max_sentences:
        - count: 1
  - id: compatibility
    description: |-
      Write what counts as breaking for every feature's operations; point at the architecture doc's Rollout.
