id: project_api
extends: api
description: |-
  The project's API conventions: the rules every feature's operations follow, and where the source of truth declares them.
  Title it `# <Project name> API`, such as `# Specstone API`, with no number.
  Aim for about 150 to 200 lines; keep one file per spec folder.
  Never write `status:`; whether code exists in a target lives in that target's record, its `implementation` docs, only.
  Hold only rules every feature uses; write any other rule in a per-feature spec doc, or in a `topic` when two or more features share it.
  Copy no request or response schema; the source of truth owns it.
  Write one rule per ID: one bullet per convention, each rule one sentence.
  Cite a rule another doc owns by a link to the item that holds it, never restate it.
  This includes a rule of a project spec doc or of an ancestor feature's spec doc.
path: specs/API.md
parent:
bundle: [implement, design]
fields:
  - id: confirmed
    disabled: true
  - id: overrides
    disabled: true
sections:
  - id: fr_trace
    disabled: true
  - id: operations
    disabled: true
  - id: conventions
    header: Conventions
    after: source_of_truth
    required: true
    prefix_id: API-C
    description: |-
      Write one bullet per API convention every feature's operations follow, such as an ID format or a pagination rule.
      Write each as `- **API-C<N>** <one sentence>`; IDs are append-only, never reused.
    lint:
      max_sentences:
        - count: 1
  - id: compatibility
    description: |-
      Write what counts as breaking for every feature's operations.
      End with a pointer to the Rollout section of the architecture doc.
