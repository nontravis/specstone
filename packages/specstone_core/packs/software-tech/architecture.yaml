id: architecture
description: |-
  The architecture of one feature: which components exist, who calls whom, and where each runs.
  Title it `# <Feature name> architecture`, such as `# Rendering architecture`, with no number.
  Aim for under 150 lines; keep one file per feature spec folder.
  Never write `status:`; whether code exists in a target lives in that target's record, its `implementation` docs, only.
  The target's record holds each story's and FR's status and code paths; `covers` names the target's own code only.
  Write no code samples; this doc describes structure, and the implementation belongs in code.
  Write one rule per ID: one Components row per component, each rule one sentence.
  A DOMAIN cites its own ARCHITECTURE by doc name plus `#anchor`, such as `architecture:rendering#components`.
path: specs/f{nn}_{slug}/ARCHITECTURE.md
parent: feature
per_target: true
fields:
  - id: covers
    type: output_ref
    list: true
    required: true
    pointer: prefix
    description: |-
      Lists the folders or files of code that the feature's spec folder covers, each relative to the code root of the doc's target (`.specstone/config.yaml`, else the project root).
      A path matches by longest prefix, so a folder covers every file under it.
sections:
  - id: component_diagram
    header: Component diagram
    required: true
    description: |-
      Write a Mermaid diagram that stands alone, so the reader needs no prose to read it.
      Give it a title, and type every box with its technology.
      Label every arrow with its intent and protocol; write no bare `Uses`.
      Quote a node label that holds `(`, `)`, `[`, `]`, `{`, or `}`, as in `A["Save (draft)"]`; write `"` in it as `#quot;`.
    lint:
      diagram:
        title: true
        edge_labels: true
        banned_labels: [Uses]
  - id: components
    header: Components
    required: true
    description: |-
      Write one table with the columns Component, Responsibility, Tech, Owns, and an optional Code path.
      Write one row per component, its Responsibility one sentence: every diagram box is a row, and every row a box.
      Write no line but a table line; put the detail of a component in Component details.
      Name the technology in Tech, so the Agent picks a library without opening the tech stack doc.
      Fill Code path with the folder or file of the component, so the Agent finds which component owns a file.
    lint:
      max_sentences:
        - count: 1
          column: Responsibility
      banned_patterns:
        - id: table_only
          pattern: '^(?!\||## )\s*\S'
          message: 'line is not a table line; guide line: Write no line but a table line'
          in: all
  - id: component_details
    header: Component details
    description: |-
      Write this section only when a component needs more than its row's one sentence.
      Write one `### <Component>` subsection per such component, headed with the row's Component cell.
  - id: interaction
    header: Interaction
    description: |-
      Write this section only when the flow is more than one request and one reply.
      Add one error scenario when the failure path differs.
  - id: deployment
    header: Deployment
    description: |-
      Write this section only when the feature runs somewhere the tech stack doc does not say.
      Write a table of where each component runs, such as process, container, edge, or browser, with a one-clause Why per row.
      Write one table per environment only when the environments differ.
  - id: rollout
    header: Rollout
    description: |-
      Omit this section when the feature has no rollout concern.
      Write a table with the columns Stage, Scope, Gate, Rollback.
      Write the Gate as a signal and a threshold, and the Rollback as a trigger and an action.
      Add expand, migrate, and contract steps for a breaking change.
  - id: observability
    header: Observability
    description: |-
      Omit this section when the feature has no observability concern.
      Write a table with the columns Signal, SLI, SLO target, Alert on.
      Write the SLI as how the signal is measured, and Alert on as a symptom, never a cause.
      Add the log channels as `<name> - <events>`.
  - id: concerns
    header: Concerns
    required: true
    description: |-
      Write one line each for Integration, Errors, Auth, Lifecycle, Events, Rollout, and Observability.
      End each line with `see <section or sibling doc>` or `N/A — <reason>`.
      Skip no concern, so a reviewer sees that the decision was made.
    lint:
      banned_patterns:
        - id: concern_ending
          pattern: '^(?!## |.*(?:\bsee\b[^—]*|N/A — .+)$)\s*\S'
          message: 'concern line has no ending; guide line: End each line with `see <section or sibling doc>` or `N/A — <reason>`'
          in: all
      required_patterns:
        - id: concern_integration
          pattern: '^(?:[-*] )?\*{0,2}Integration\b'
          message: 'no Integration concern line; guide line: Write one line each for Integration, Errors, Auth, Lifecycle, Events, Rollout, and Observability'
        - id: concern_errors
          pattern: '^(?:[-*] )?\*{0,2}Errors\b'
          message: 'no Errors concern line; guide line: Write one line each for Integration, Errors, Auth, Lifecycle, Events, Rollout, and Observability'
        - id: concern_auth
          pattern: '^(?:[-*] )?\*{0,2}Auth\b'
          message: 'no Auth concern line; guide line: Write one line each for Integration, Errors, Auth, Lifecycle, Events, Rollout, and Observability'
        - id: concern_lifecycle
          pattern: '^(?:[-*] )?\*{0,2}Lifecycle\b'
          message: 'no Lifecycle concern line; guide line: Write one line each for Integration, Errors, Auth, Lifecycle, Events, Rollout, and Observability'
        - id: concern_events
          pattern: '^(?:[-*] )?\*{0,2}Events\b'
          message: 'no Events concern line; guide line: Write one line each for Integration, Errors, Auth, Lifecycle, Events, Rollout, and Observability'
        - id: concern_rollout
          pattern: '^(?:[-*] )?\*{0,2}Rollout\b'
          message: 'no Rollout concern line; guide line: Write one line each for Integration, Errors, Auth, Lifecycle, Events, Rollout, and Observability'
        - id: concern_observability
          pattern: '^(?:[-*] )?\*{0,2}Observability\b'
          message: 'no Observability concern line; guide line: Write one line each for Integration, Errors, Auth, Lifecycle, Events, Rollout, and Observability'
  - id: design_references
    header: Design references
    description: |-
      List at most three links to an ADR or design doc, one line each.
      This section is the only home for rationale.
    lint:
      max_lines: 3
  - id: open_questions
    header: Open questions
    description: |-
      List the unresolved decisions.
lint:
  max_chars: 60000
  max_lines: 400
reference:
  - title: The C4 model, Notation
    url: https://c4model.com/diagrams/notation
    locator: Diagrams; Elements; Relationships
  - title: arc42 section 5, Building Block View
    url: https://docs.arc42.org/section-5/
    locator: Whitebox template; black box template
  - title: Google SRE Book, ch. 27 Reliable Product Launches at Scale
    url: https://sre.google/sre-book/reliable-product-launches/
    locator: Rollout Planning; Gradual and Staged Rollouts
  - title: Google SRE Book, ch. 6 Monitoring Distributed Systems
    url: https://sre.google/sre-book/monitoring-distributed-systems/
    locator: Symptoms Versus Causes; The Four Golden Signals
