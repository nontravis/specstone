id: domain
description: |-
  The domain model of one feature: the concepts it owns, how they are shaped, and the invariants that hold.
  Title it `# <Feature name> domain`, such as `# Rendering domain`, with no number.
  Aim for about 150 to 200 lines; keep one file per feature spec folder.
  Never write `status:`; whether code exists in a target lives in that target's record, its `implementation` docs, only.
  Write one rule per ID: one bullet per invariant, each rule one sentence.
  A DOMAIN cites its own ARCHITECTURE by a section link, such as `[architecture:rendering](ARCHITECTURE.md#components)`.
  Cite a rule another doc owns by a link to the item that holds it, never restate it.
  This includes a rule of a project spec doc or of an ancestor feature's spec doc.
  This doc holds one feature's spec; a rule every feature uses goes to the project's DOMAIN doc.
  Write an `Overrides:` line right after an item that departs from a rule above, as `Overrides: [<ID>](<doc>#<section>) — <how it differs>, because <why>`, and record its `overrides` entry.
path: specs/f{nn}_{slug}/DOMAIN.md
parent: feature
per_target: true
fields:
  - id: overrides
    type: string
    list: true
    description: |-
      Records one `<doc type>:<name>#<ID> <fingerprint>` entry per item the doc's `Overrides:` lines link.
      Example: `project_domain:domain#INV-3 3f9a1c0b7e2d`; the entry counts once the Owner approves the doc.
  - id: tasks
    type: task_ref
    list: true
    description: |-
      Lists the tasks that track the doc's work, each `<item>:<task>`, or `<task>` alone for the whole doc, such as `INV-4:ENG-42`.
      `specstone-sync-sdd` removes an entry once a synced commit closes its task with a closing word, such as `Closes ENG-42`; put that word in the commit that finishes the task's work.
sections:
  - id: entities
    header: Entities
    required: true
    description: |-
      Write one table with the columns Entity, Kind, Identity, Owns, Refers to (by id), and Notes; write one row per entity.
      Write Kind as Aggregate root, Entity, Service, or Repository.
      Refers to (by id) is optional; use it to name another aggregate by its id.
    lint:
      banned_patterns:
        - id: entity_kind
          pattern: '^\|[^|]*\|(?! *(?:Kind|Aggregate root|Entity|Service|Repository|:?-+:?) *\|)[^|]*\|'
          message: 'Kind is not an allowed value; guide line: Write Kind as Aggregate root, Entity, Service, or Repository'
          in: all
  - id: value_objects
    header: Value objects
    description: |-
      Write this section only when the feature defines a value object.
      Write a table with the columns VO, Backed by, Validation.
      Make each value object immutable.
  - id: invariants
    header: Invariants
    required: true
    prefix_id: INV-
    description: |-
      Write each invariant as `- **INV-<N>** <one sentence>`, never a numbered item; IDs are append-only, never reused.
      Nest `- **Enforcer:** <aggregate root>` and `- **Consistency:** immediate` (or `eventual`) under it.
      Under an eventual invariant, nest `- **Corrective policy:** <how the system restores the rule>` too.
      Keep a bound (`timeout 10 s`) in the invariant it bounds; mechanics to ARCHITECTURE, unhandled cases to `known_limits`.
      Write no trace tag; the DOMAIN's `reference` field holds its trace.
    lint:
      max_sentences:
        - count: 1
      item_fields:
        - field: Enforcer
        - field: Consistency
          values: [immediate, eventual]
        - field: Corrective policy
          when:
            field: Consistency
            value: eventual
      banned_patterns:
        - id: numbered_invariant
          pattern: '^\d+[.)] '
          message: 'invariant is a numbered item; guide line: never a numbered item'
          in: all
  - id: known_limits
    header: Known limits
    description: |-
      Write this section only when the system leaves a case unhandled.
      Write one bullet per case the system does not handle, and say what happens then.
      Keep a bound an invariant enforces, such as `timeout 10 s`, in that invariant, not here.
  - id: lifecycle
    header: Lifecycle
    description: |-
      Write a Mermaid `stateDiagram-v2` only when an entity has a status with 4 or more states.
  - id: data_touch
    header: Data touch
    description: |-
      Write a table with the columns Table, Operation, Field / Change; write one row per table the feature touches.
      Copy no column definitions; the schema file owns them.
  - id: commands_and_events
    header: Commands and events
    description: |-
      Write one table with the columns Command, Aggregate, Event emitted.
  - id: terms
    header: Terms
    description: |-
      List only the terms beyond the project glossary.
lint:
  max_chars: 50000
  max_lines: 300
reference:
  - title: Eric Evans, Domain-Driven Design Reference (2015)
    url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
    locator: Ubiquitous Language; Entities; Value Objects; Domain Events; Aggregates
  - title: Vaughn Vernon, Effective Aggregate Design, Part I
    url: https://www.dddcommunity.org/wp-content/uploads/files/pdf_articles/Vernon_2011_1.pdf
    locator: Rule - Model True Invariants in Consistency Boundaries; Rule - Design Small Aggregates
  - title: Vaughn Vernon, Effective Aggregate Design, Part II
    url: https://www.dddcommunity.org/wp-content/uploads/files/pdf_articles/Vernon_2011_2.pdf
    locator: Rule - Reference Other Aggregates By Identity; Rule - Use Eventual Consistency Outside the Boundary
  - title: DDD Crew, Aggregate Design Canvas
    url: https://github.com/ddd-crew/aggregate-design-canvas
    locator: How to Use, sections 3-7
