id: domain
description: |-
  One feature's domain model: its concepts, their shapes, and the invariants that hold.
  Title it `# <Feature name> domain`, such as `# Rendering domain`, with no number.
  Write one rule per ID: one bullet per invariant.
  Cite this feature's ARCHITECTURE by a section link, such as `[architecture:rendering](ARCHITECTURE.md#components)`.
  Put a rule every feature uses in the project's DOMAIN doc.
path: specs/f{nn}_{slug}/DOMAIN.md
parent: feature
per_target: true
sections:
  - id: entities
    header: Entities
    required: true
    description: |-
      Write one table of Entity, Kind, Identity, Owns, an optional Refers to (by id) naming another aggregate, and Notes, one row per entity.
      Write Kind as Aggregate root, Entity, Service, or Repository.
    lint:
      banned_patterns:
        - id: entity_kind
          pattern: '^\|[^|]*\|(?! *(?:Kind|Aggregate root|Entity|Service|Repository|:?-+:?) *\|)[^|]*\|'
          message: 'Kind is not an allowed value; guide line: Write Kind as Aggregate root, Entity, Service, or Repository'
          in: all
  - id: value_objects
    header: Value objects
    description: |-
      Write a table of VO, Backed by, Validation.
      Make each value object immutable.
  - id: invariants
    header: Invariants
    required: true
    prefix_id: INV-
    description: |-
      Write each invariant as `- **INV-<N>** <rule>`, never a numbered item; IDs are append-only, never reused.
      Nest `- **Enforcer:** <aggregate root>` and `- **Consistency:** immediate` (or `eventual`) under it.
      Under an eventual invariant, nest `- **Corrective policy:** <how the system restores the rule>` too.
      Keep a bound (`timeout 10 s`) in the invariant it bounds; mechanics to ARCHITECTURE, unhandled cases to `known_limits`.
      Write no trace tag, since `reference` holds the trace; a cite or ownership note may close an invariant.
    lint:
      max_sentences:
        - count: 1
      item_fields:
        - field: Enforcer
        - field: Consistency
          values: [immediate, eventual]
        - field: Corrective policy
          when:
            field: Consistency
            value: eventual
      banned_patterns:
        - id: numbered_invariant
          pattern: '^\d+[.)] '
          message: 'invariant is a numbered item; guide line: never a numbered item'
          in: all
  - id: known_limits
    header: Known limits
    description: |-
      Write one bullet per unhandled case, saying what happens then.
      Keep a bound an invariant enforces in that invariant.
  - id: lifecycle
    header: Lifecycle
    description: |-
      Draw a Mermaid `stateDiagram-v2` only for a status with 4 or more states.
  - id: data_touch
    header: Data touch
    description: |-
      Write a table of Table, Operation, Field / Change, one row per table the feature touches.
      Copy no column definitions; the schema file owns them.
  - id: commands_and_events
    header: Commands and events
    description: |-
      Write one table of Command, Aggregate, Event emitted.
  - id: terms
    header: Terms
    description: |-
      List only the terms beyond the project glossary.
lint:
  max_chars: 50000
  max_lines: 300
reference:
  - title: Eric Evans, Domain-Driven Design Reference (2015)
    url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
    locator: Ubiquitous Language; Entities; Value Objects; Domain Events; Aggregates
  - title: Vaughn Vernon, Effective Aggregate Design, Part I
    url: https://www.dddcommunity.org/wp-content/uploads/files/pdf_articles/Vernon_2011_1.pdf
    locator: Rule - Model True Invariants in Consistency Boundaries; Rule - Design Small Aggregates
  - title: Vaughn Vernon, Effective Aggregate Design, Part II
    url: https://www.dddcommunity.org/wp-content/uploads/files/pdf_articles/Vernon_2011_2.pdf
    locator: Rule - Reference Other Aggregates By Identity; Rule - Use Eventual Consistency Outside the Boundary
  - title: DDD Crew, Aggregate Design Canvas
    url: https://github.com/ddd-crew/aggregate-design-canvas
    locator: How to Use, sections 3-7
