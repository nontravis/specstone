id: project_integration
extends: integration
description: |-
  The outside systems the project's features call: why, over which protocol, and the contract with each.
  Title it `# <Project name> integrations`, such as `# Specstone integrations`, with no number.
  Write this doc only when every feature follows one rule for outside calls.
  Write one rule per ID: one `###` per system, filled as Contract per system gives; state every other rule in one sentence.
path: specs/INTEGRATION.md
parent:
bundle: [implement, design]
fields:
  - id: overrides
    disabled: true
sections:
  - id: external_systems
    description: |-
      Write a table with the columns System, Purpose, Protocol, Owned by; list every outside system the project calls.
      Write Purpose as why the project calls the system, and Protocol such as REST, gRPC, webhook, or event.
      Write Owned by as an internal team or a vendor.
