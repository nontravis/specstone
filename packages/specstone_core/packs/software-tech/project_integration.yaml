id: project_integration
extends: integration
description: |-
  The outside systems the project's features call: why, over which protocol, and the contract with each.
  Title it `# <Project name> integrations`, such as `# Specstone integrations`, with no number.
  Write this doc only when every feature follows one rule for outside calls.
  Aim for about 150 to 200 lines; keep one file per spec folder.
  Never write `status:`; whether code exists in a target lives in that target's record, its `implementation` docs, only.
  Hold only rules every feature uses; write any other rule in a per-feature spec doc, or in a `topic` when two or more features share it.
  Write one rule per ID: one `###` per system, each rule one sentence.
  Cite a rule another doc owns by a link to the item that holds it, never restate it.
  This includes a rule of a project spec doc or of an ancestor feature's spec doc.
path: specs/INTEGRATION.md
parent:
bundle: [implement, design]
fields:
  - id: overrides
    disabled: true
sections:
  - id: external_systems
    description: |-
      Write a table with the columns System, Purpose, Protocol, Owned by; list every outside system the project calls.
      Write Purpose as why the project calls the system, and Protocol such as REST, gRPC, webhook, or event.
      Write Owned by as an internal team or a vendor.
  - id: events
    description: |-
      Omit this section when the project has no event concern.
      Write a table with the columns Event type, Channel, Action, Payload schema, Dedup key, Version rule.
      Write Action as send or receive.
      Write Payload schema as a pointer to the source of truth; copy no payload schema.
