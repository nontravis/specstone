id: project_error
extends: error
description: |-
  The project's error taxonomy: the codes every feature raises, how a client acts on each, and when a call retries.
  Title it `# <Project name> errors`, such as `# Specstone errors`, with no number.
  Put no stack trace or internals in any error body.
  Write one rule per ID: one catalog row per code.
path: specs/ERROR.md
parent:
bundle: [implement, design]
fields:
  - id: overrides
    disabled: true
sections:
  - id: error_envelope
    required: true
    description: |-
      Write the project's one error envelope, and show its shape.
      A feature's `error_envelope` departs from it only with its reason.
  - id: error_catalog
    description: |-
      Write a table with the columns Code, Exit/HTTP, Category, Triggered by, Client guidance.
      Add an optional Details column holding machine fields per code, such as `file`, `key`, `retry_after`. Add an optional Group column, a slug naming codes that several operations return together, such as `template_fault`; keep each slug unique in the catalog.
      Keep codes stable, never reused for a different error.
      Write Triggered by as the general condition that raises the code in the project, such as a flag out of range.
      List no raising site there. Write Client guidance as one line: the action the client takes, not user copy.
  - id: retry_policy
    required: false
