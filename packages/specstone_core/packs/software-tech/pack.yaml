name: software-tech
version: 1.25.0
extends: prd-core
migrations:
  - from: 1.4.0
    steps:
      - move_to_record:
          doc_types: [user_story, fr]
          fields: [status, implements]
          to: implementation
  - from: 1.6.0
    steps:
      - stamp_code_fingerprints: {}
  - from: 1.7.0
    steps:
      - move_file:
          doc_type: implementation
          from: specs/f{nn}_{slug}/IMPLEMENTATION.md
          to: .specstone/records/f{nn}_{slug}/IMPLEMENTATION.md
      - restamp_code_fingerprints: {}
  - from: 1.13.0
    steps:
      - drop_default_lines:
          doc_types: [domain, project_domain]
  - from: 1.14.0
    steps:
      - mark_retrim:
          doc_types: [domain, project_domain]
          sections: [invariants, value_objects]
  - from: 1.16.0
    steps:
      - drop_section:
          doc_types: [architecture, project_architecture]
          section:
            id: design_references
            header: Design references
  - from: 1.17.0
    steps:
      - rename_section:
          doc_type: architecture
          from: {id: component_diagram, header: Component diagram}
          to: {id: technical_diagram, header: Technical diagram}
      - rename_section:
          doc_type: project_architecture
          from: {id: component_diagram, header: Component diagram}
          to: {id: technical_diagram, header: Technical diagram}
  - from: 1.19.0
    steps:
      - merge_doc:
          from: {id: error, path: 'specs/f{nn}_{slug}/ERROR.md'}
          to: api
          sections:
            - from: {id: error_catalog, header: Error catalog}
              to: errors
      - merge_doc:
          from: {id: project_error, path: specs/ERROR.md}
          to: project_api
          sections:
            - from: {id: error_envelope, header: Error envelope}
              to: error_model
            - from: {id: error_catalog, header: Error catalog}
              to: error_model
            - from: {id: retry_policy, header: Retry policy}
              to: error_model
      - mark_retrim:
          doc_types: [api, project_api]
          sections: [errors, error_model]
      - mark_retrim:
          doc_types: [fr]
          sections: [input_output]
  - from: 1.20.0
    steps:
      - move_to_record:
          doc_types: [architecture]
          fields: [covers]
          to: implementation
      - merge_doc:
          from: {id: domain, path: 'specs/f{nn}_{slug}/DOMAIN.md'}
          to: architecture
          sections:
            - from: {id: entities, header: Entities}
              to: data
            - from: {id: data_touch, header: Data touch}
              to: data
      - merge_doc:
          from: {id: project_domain, path: specs/DOMAIN.md}
          to: project_architecture
          sections:
            - from: {id: entities, header: Entities}
              to: data
            - from: {id: data_touch, header: Data touch}
              to: data
      - merge_doc:
          from: {id: project_integration, path: specs/INTEGRATION.md}
          to: project_architecture
          sections:
            - from: {id: external_systems, header: External systems}
              to: external_systems
            - from: {id: contract_per_system, header: Contract per system}
              to: contract_per_system
      - merge_doc:
          from: {id: auth, path: 'specs/f{nn}_{slug}/AUTH.md'}
          to: security
          sections:
            - from: {id: enforcement, header: Enforcement}
              to: enforcement
            - from: {id: audit, header: Audit}
              to: audit
      - merge_doc:
          from: {id: project_auth, path: specs/AUTH.md}
          to: project_security
          sections:
            - from: {id: enforcement, header: Enforcement}
              to: enforcement
            - from: {id: audit, header: Audit}
              to: audit
      - drop_section:
          doc_types: [architecture, project_architecture]
          section:
            id: concerns
            header: Concerns
      - drop_doc_type: {id: topic, path: 'specs/topics/{slug}.md'}
  - from: 1.23.0
    steps:
      - relink_merged_docs: {}
shared_lines:
  - id: cite_spec_docs
    text: Link to the item of a project or ancestor-feature spec doc's rule; never restate it.
    for_doc_types: [api, architecture, decision, implementation, integration, project_api, project_architecture, project_security, security, tech_stack]
  - id: no_status
    text: 'Never write `status:`; only a target''s `implementation` record says if its code exists.'
    for_doc_types: [api, architecture, decision, implementation, integration, project_api, project_architecture, project_security, security, tech_stack]
  - id: project_rules_only
    text: Hold only rules every feature uses; write a rule two or more features share as a `project_architecture` concept naming them, and any other rule in a per-feature spec doc.
    for_doc_types: [project_api, project_architecture, project_security]
  - id: one_file_per_feature_folder
    text: Keep one file per doc type per feature spec folder.
    for_doc_types: [api, architecture, integration, security]
  - id: one_file_per_spec_folder
    text: Keep one file per doc type in each spec folder.
    for_doc_types: [project_api, project_architecture, project_security]
  - id: overrides_line
    text: 'Under an item departing from a rule above, write `Overrides: [<ID>](<doc>#<section>) — <how it differs>, because <why>` and record its `overrides` entry.'
    for_doc_types: [api, integration]
  - id: overrides_line_table
    text: 'Under an item departing from a rule above, or under its table for a table row, write `Overrides: [<ID>](<doc>#<section>) — <how it differs>, because <why>`, naming the row in the how-clause, and record its `overrides` entry.'
    for_doc_types: [architecture, security]
  - id: wire_fact_home
    text: A wire-contract fact lives in the `api` operation that traces the FR; the FR keeps its product words.
    for_doc_types: [fr]
  - id: mechanism_home
    text: A lock, retry, or parser mechanism lives in the feature's `architecture` doc, never in the FR.
    for_doc_types: [fr]
leftover_homes:
  - doc_types: [architecture, project_architecture]
    section: {id: value_objects, header: Value objects}
    to: [fr]
    home: 'the Input / Output of the FR it constrains, in product words'
  - doc_types: [architecture, project_architecture]
    section: {id: invariants, header: Invariants}
    to: [user_story, fr]
    home: 'the story Rules or the FR that states it; an invariant only one FR states is deleted'
  - doc_types: [architecture, project_architecture]
    section: {id: known_limits, header: Known limits}
    to: [feature]
    home: 'the feature''s Out-of-scope, as `<case> — not planned`'
  - doc_types: [architecture, project_architecture]
    section: {id: lifecycle, header: Lifecycle}
    to: [fr, architecture]
    home: 'the FR Behavior when users see the states, else the Shape cell of its store''s `data` row, in words, no diagram'
  - doc_types: [architecture, project_architecture]
    section: {id: commands_and_events, header: Commands and events}
    to: [api, integration]
    home: 'an `api` events block, or `integration` `events` for an outside format'
  - doc_types: [architecture, project_architecture]
    section: {id: terms, header: Terms}
    to: [glossary]
    home: 'the PRD glossary'
  - doc_types: [security, project_security]
    section: {id: roles, header: Roles}
    to: [user_story, fr, gnfr]
    home: 'the PRD, as a story Rule, an FR, or a GNFR security item'
  - doc_types: [security, project_security]
    section: {id: resource_matrix, header: Resource matrix}
    to: [user_story, fr, gnfr]
    home: 'the PRD, as a story Rule, an FR, or a GNFR security item'
  - doc_types: [security, project_security]
    section: {id: conditions, header: Conditions}
    to: [user_story, fr, gnfr]
    home: 'the PRD, as a story Rule, an FR, or a GNFR security item'
  - doc_types: [security, project_security]
    section: {id: field_rules, header: Field rules}
    to: [user_story, fr, gnfr]
    home: 'the PRD, as a story Rule, an FR, or a GNFR security item'
  - doc_types: [security, project_security]
    section: {id: authentication_and_sessions, header: Authentication and sessions}
    to: [decision, gnfr, nf]
    home: 'the why of an auth method to a `decision` doc, and a timeout to the GNFR or an nf'
  - doc_types: [security, project_security]
    section: {id: scopes, header: Scopes}
    to: [api]
    home: 'the `**Auth:**` line of the `api` operation'
  - doc_types: [architecture, project_architecture]
    section: {id: component_details, header: Component details}
    to: [architecture, decision]
    home: 'a design risk to `risks`, a data shape to `data`, and a decision''s why to a `decision` doc; a code mirror is deleted'
  - doc_types: [architecture, project_architecture]
    section: {id: interaction, header: Interaction}
    to: [architecture, fr, decision]
    home: 'its diagrams to `## Technical diagram` as sequence views; each other statement to an FR''s Rationale or a `decision` doc'
  - doc_types: [api, project_api]
    section: {id: fallback, header: Fallback}
    to: [fr]
    home: 'the FR it serves'
  - doc_types: [api]
    section: {id: error_envelope, header: Error envelope}
    to: [project_api, api]
    home: 'the target''s `project_api` `error_model`; a feature that departs from the project rule writes an `Overrides:` line under its `api` `errors` instead'
  - doc_types: [api]
    section: {id: retry_policy, header: Retry policy}
    to: [project_api, api]
    home: 'the target''s `project_api` `error_model`; a feature that departs from the project rule writes an `Overrides:` line under its `api` `errors` instead'
  - doc_types: [project_architecture]
    section: {id: translation, header: Translation}
    to: [integration, api]
    home: 'the `integration` doc of the feature it serves, or an `api` events block'
  - doc_types: [project_architecture]
    section: {id: events, header: Events}
    to: [integration, api]
    home: 'the `integration` doc of the feature it serves, or an `api` events block'
  - path: 'specs/topics/{slug}.md'
    to: [project_architecture, user_story, fr]
    home: 'a shared technical rule to a `CC-` item of `crosscutting_concepts`, its `Binds:` line linking each feature whose record covers one of the topic''s paths; a shared observable rule to the story Rules or FR of the feature whose code carries it, every other feature citing it by link; `interface` and code-pointed `model` content deleted'
  - path: 'specs/INDEX.md'
    to: [implementation, tech_stack, api, project_architecture]
    home: 'each code path to the record''s `covers` and the tech stack''s `code` roots; the source-of-truth table to the `api` docs; a cross-cutting statement to the tech stack''s `constraints` or the project architecture doc'
  - doc_types: [project]
    section: {id: tech_stack, header: Tech stack}
    to: [tech_stack]
    home: 'the tech stack doc''s `stack` section'
  - doc_types: [project]
    section: {id: naming_canonicalization, header: Naming canonicalization}
    to: [tech_stack]
    home: 'the tech stack doc''s `naming` section'
shared_fields:
  - id: overrides
    type: string
    list: true
    for_doc_types: [api, architecture, integration, security]
    description: |-
      Records one `<doc type>:<name>#<ID> <fingerprint>` per `Overrides:` line link, such as `project_api:api#API-C1 3f9a1c0b7e2d`, counted once the Owner approves the doc.
  - id: tasks
    type: task_ref
    list: true
    for_doc_types: [api, architecture, decision, integration, security, tech_stack]
    description: |-
      Lists the doc's tasks as `<item>:<task>`, or `<task>` for the whole doc, such as `API-C2:ENG-42`; `specstone-sync-sdd` drops one once its finishing commit, holding a closing word such as `Closes ENG-42`, syncs.
