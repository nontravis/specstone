name: software-tech
version: 1.15.0
extends: prd-core
migrations:
  - from: 1.4.0
    steps:
      - move_to_record:
          doc_types: [user_story, fr]
          fields: [status, implements]
          to: implementation
  - from: 1.6.0
    steps:
      - stamp_code_fingerprints: {}
  - from: 1.7.0
    steps:
      - move_file:
          doc_type: implementation
          from: specs/f{nn}_{slug}/IMPLEMENTATION.md
          to: .specstone/records/f{nn}_{slug}/IMPLEMENTATION.md
      - restamp_code_fingerprints: {}
  - from: 1.13.0
    steps:
      - drop_default_lines:
          doc_types: [domain, project_domain]
  - from: 1.14.0
    steps:
      - mark_retrim:
          doc_types: [domain, project_domain]
          sections: [invariants, value_objects]
shared_lines:
  - id: cite_spec_docs
    text: Cite a project or ancestor-feature spec doc's rule by a link to its item, never restate it.
    for_doc_types: [api, architecture, auth, domain, error, implementation, integration, project_api, project_architecture, project_auth, project_domain, project_error, project_integration, tech_stack, topic]
  - id: no_status
    text: 'Never write `status:`; only a target''s `implementation` record says whether its code exists.'
    for_doc_types: [api, architecture, auth, domain, error, implementation, integration, project_api, project_architecture, project_auth, project_domain, project_error, project_integration, tech_stack, topic]
  - id: project_rules_only
    text: Hold only rules every feature uses; write any other rule in a per-feature spec doc, or in a `topic` when two or more features share it.
    for_doc_types: [project_api, project_architecture, project_auth, project_domain, project_error, project_integration]
  - id: one_file_per_feature_folder
    text: Keep one file per doc type in each feature spec folder.
    for_doc_types: [api, architecture, auth, domain, error, integration]
  - id: one_file_per_spec_folder
    text: Keep one file per doc type in each spec folder.
    for_doc_types: [project_api, project_architecture, project_auth, project_domain, project_error, project_integration]
  - id: overrides_line
    text: 'Right after an item departing from a rule above, write `Overrides: [<ID>](<doc>#<section>) — <how it differs>, because <why>` and record its `overrides` entry.'
    for_doc_types: [api, domain, integration]
  - id: overrides_line_table
    text: 'Right after an item departing from a rule above, or right under its table for a table row, write `Overrides: [<ID>](<doc>#<section>) — <how it differs>, because <why>`, naming the row in the how-clause, and record its `overrides` entry.'
    for_doc_types: [architecture, auth, error]
shared_fields:
  - id: overrides
    type: string
    list: true
    for_doc_types: [api, architecture, auth, domain, error, integration, topic]
    description: |-
      Records one `<doc type>:<name>#<ID> <fingerprint>` per item an `Overrides:` line links, such as `project_domain:domain#INV-3 3f9a1c0b7e2d`; it counts once the Owner approves the doc.
  - id: tasks
    type: task_ref
    list: true
    for_doc_types: [api, architecture, auth, domain, error, integration, tech_stack, topic]
    description: |-
      Lists the doc's tasks, each `<item>:<task>`, or `<task>` alone for the whole doc, such as `INV-4:ENG-42`.
      Put a closing word, such as `Closes ENG-42`, in a task's finishing commit; once it syncs, `specstone-sync-sdd` removes the entry.
