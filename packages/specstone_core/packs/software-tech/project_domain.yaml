id: project_domain
extends: domain
description: |-
  The project's domain model: the concepts every feature uses, how they are shaped, and the invariants that hold.
  Title it `# <Project name> domain`, such as `# Specstone domain`, with no number.
  Write one rule per ID: one bullet per invariant.
  The project's DOMAIN cites the project's ARCHITECTURE by a section link, such as `[architecture](ARCHITECTURE.md#components)`.
path: specs/DOMAIN.md
parent:
bundle: [implement, design]
fields:
  - id: overrides
    disabled: true
sections:
  - id: invariants
    description: |-
      Write each invariant as `- **INV-<N>** <rule>`, never a numbered item; IDs are append-only, never reused.
      Nest `- **Enforcer:** <aggregate root>` and `- **Consistency:** immediate` (or `eventual`) under it.
      Under an eventual invariant, nest `- **Corrective policy:** <how the system restores the rule>` too.
      Keep a bound (`timeout 10 s`) in the invariant it bounds; mechanics to ARCHITECTURE, unhandled cases to `known_limits`.
      Write no trace tag, since `reference` holds the trace; a cite or ownership note may close an invariant.
  - id: data_touch
    description: |-
      Write a table of Table, Operation, Field / Change, one row per table the project touches.
      Copy no column definitions; the schema file owns them.
