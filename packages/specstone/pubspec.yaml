name: specstone
description: Specstone keeps PRD and spec documents for spec-driven development, with a CLI and an MCP server.
version: 2.0.0
repository: https://github.com/nontravis/specstone/tree/main/packages/specstone

environment:
  sdk: ^3.13.5

resolution: workspace

executables:
  specstone:

dependencies:
  args: ^2.7.0
  specstone_core: ^2.0.0

dev_dependencies:
  crypto: ^3.0.8
  ffi: ^2.2.0
  markdown: ^7.3.1
  specstone_test_support:
  sqlite3: ^3.9.1
  test: ^1.33.0
  yaml: ^3.1.4
